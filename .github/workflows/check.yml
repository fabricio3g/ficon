name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint icons against CONTRIBUTING.md
        run: node scripts/build.mjs --check

      - name: Generated packages are up to date
        run: |
          npm run build -- --quiet
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Run npm run build and commit the generated files."
            exit 1
          fi

      - name: Install smoke-test dependencies
        run: npm i --no-save react react-dom vue typescript @types/react

      - name: Smoke test (React and Vue render, types under --strict)
        run: node scripts/smoke.mjs
