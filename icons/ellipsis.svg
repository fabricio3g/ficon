<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle class="a" cx="3.5" cy="8" r=".85" fill="currentColor" stroke="none"/>
  <circle class="b" cx="8" cy="8" r=".85" fill="currentColor" stroke="none"/>
  <circle class="c" cx="12.5" cy="8" r=".85" fill="currentColor" stroke="none"/>
  <style>
    .a { animation: hop 200ms ease-out; }
    .b { animation: hop 200ms ease-out 50ms; }
    .c { animation: hop 200ms ease-out 100ms; }
    @keyframes hop { 50% { translate: 0 -1.5px; } }
  </style>
</svg>
