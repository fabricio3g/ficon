<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle class="a" cx="8" cy="8" r="6"/>
  <circle class="b" cx="8" cy="8" r="3"/>
  <circle cx="8" cy="8" r=".85" fill="currentColor" stroke="none"/>
  <style>
    .a { animation: close 260ms ease-out; }
    .b { animation: lock 200ms ease-out 80ms; }
    @keyframes close { 50% { scale: 0.9; } }
    @keyframes lock { 50% { scale: 0.85; } }
  </style>
</svg>
