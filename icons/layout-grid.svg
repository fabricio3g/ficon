<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect class="a" x="3" y="3" width="3.5" height="3.5" rx="1"/>
  <rect class="b" x="9.5" y="3" width="3.5" height="3.5" rx="1"/>
  <rect class="b" x="3" y="9.5" width="3.5" height="3.5" rx="1"/>
  <rect class="c" x="9.5" y="9.5" width="3.5" height="3.5" rx="1"/>
  <style>
    .a { animation: pop 180ms ease-out; }
    .b { animation: pop 180ms ease-out 50ms; }
    .c { animation: pop 180ms ease-out 100ms; }
    @keyframes pop { 50% { scale: 0.85; } }
  </style>
</svg>
