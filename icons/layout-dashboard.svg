<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect class="a" x="3" y="3" width="3.5" height="4.5" rx="1"/>
  <rect x="3" y="10.5" width="3.5" height="2.5" rx="1"/>
  <rect x="9.5" y="3" width="3.5" height="2.5" rx="1"/>
  <rect class="b" x="9.5" y="8.5" width="3.5" height="4.5" rx="1"/>
  <style>
    .a { transform-origin: 50% 0%; animation: grow 260ms ease-in-out; }
    .b { transform-origin: 50% 100%; animation: grow 260ms ease-in-out; }
    @keyframes grow { 50% { scale: 1 0.85; } }
  </style>
</svg>
